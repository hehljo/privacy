<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rechtliche Hinweise</title>
<meta name="description" content="Impressum und Datenschutzerklärungen zu den Apps von Johannes Hehl Meitinger." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://hehljo.github.io/privacy/" />
<link rel="alternate" hreflang="de" href="https://hehljo.github.io/privacy/" />
<link rel="alternate" hreflang="en" href="https://hehljo.github.io/privacy/en/" />
<style>
:root{color-scheme:light dark;--bg:#fbfaf7;--fg:#1c1917;--muted:#57534e;--rule:#e7e3dc;--accent:#7a5c3a}
@media (prefers-color-scheme:dark){:root{--bg:#14120f;--fg:#f2efe9;--muted:#b5aea4;--rule:#332e28;--accent:#d3b58a}}
*{box-sizing:border-box}
body{margin:0;padding:2.5rem 1rem 4rem;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
main{max-width:42rem;margin:0 auto}
h1{font-size:1.75rem;line-height:1.25;margin:0 0 .35rem}
h2{font-size:1.125rem;margin:2.25rem 0 .5rem}
p,li{color:var(--fg)}
.lead{color:var(--muted);margin:0 0 2rem}
.meta{color:var(--muted);font-size:.9rem}
ul{padding-left:1.25rem}
li{margin:.3rem 0}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--rule);margin:2.5rem 0 1.25rem}
nav{margin:0 0 2rem;font-size:.9rem}
nav a{margin-right:1rem}
.callout{border:1px solid var(--rule);border-radius:.65rem;padding:1rem 1.15rem;margin:1.5rem 0;background:color-mix(in srgb,var(--bg) 80%,var(--fg) 4%)}
.langs{margin:2.5rem 0 0;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Rechtliche Hinweise</h1>
<p class="lead">Impressum und Datenschutzerklärungen zu den hier aufgeführten Apps.</p>
<h2>Allgemein</h2>
<ul>
  <li><a href="https://hehljo.github.io/privacy/impressum/">Impressum</a></li>
</ul>
<h2>Apps</h2>
<ul>
  <li><a href="https://hehljo.github.io/privacy/henga/">Datenschutzerklärung – Henga</a></li>
  <li><a href="https://hehljo.github.io/privacy/lugga/">Datenschutzerklärung – Lugga</a></li>
</ul>
<p class="langs"><a href="https://hehljo.github.io/privacy/en/">English</a></p>

</main>
</body>
</html>
